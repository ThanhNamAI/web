<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #F3E5F5; color: #12122A; font-family: Arial, Helvetica, sans-serif; display: flex; position: relative; }
    .left { width: 74%; min-height: 720px; padding: 88px 0 0 96px; display: flex; flex-direction: column; }
    .eyebrow { font-size: 16px; font-weight: 800; letter-spacing: 2.5px; color: #5D4B74; text-transform: uppercase; }
    h1 { margin-top: 28px; max-width: 810px; font-size: 70px; line-height: 0.98; letter-spacing: -3.2px; font-weight: 900; }
    .highlight { background: #FFEB3B; padding: 0 10px 4px; box-shadow: 4px 4px 0 #12122A; }
    .subtitle { margin-top: 28px; max-width: 650px; font-size: 25px; line-height: 1.35; font-weight: 500; color: #4A4A4A; }
    .footer { margin-top: auto; margin-bottom: 72px; font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
    .right { width: 26%; min-height: 720px; border-left: 3px solid #12122A; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .badge { width: 206px; min-height: 206px; border-radius: 38px; background: #FFEB3B; border: 3px solid #12122A; box-shadow: 10px 10px 0 #12122A; display: flex; flex-direction: column; justify-content: center; align-items: center; transform: rotate(6deg); }
    .badge strong { font-size: 72px; line-height: 0.8; font-weight: 900; }
    .badge span { margin-top: 13px; font-size: 16px; font-weight: 900; letter-spacing: 1.2px; }
    .dot { position: absolute; width: 48px; min-height: 48px; border-radius: 50%; background: #12122A; }
    .dot.one { top: 66px; right: 48px; }
    .dot.two { bottom: 72px; left: -22px; background: #FFEB3B; border: 3px solid #12122A; }
    .line { position: absolute; width: 210px; min-height: 20px; background: #FFFFFF; border: 3px solid #12122A; box-shadow: 4px 4px 0 #12122A; transform: rotate(-36deg); bottom: 112px; right: -52px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="left">
      <div class="eyebrow">TOEIC Quest · Đề xuất sản phẩm</div>
      <h1>Từ học đều<br>đến <span class="highlight">tiến bộ thật.</span></h1>
      <p class="subtitle">Chiến lược 90 ngày để tăng gắn kết người học, nhưng vẫn đo được năng lực TOEIC.</p>
      <div class="footer">Lộ trình ưu tiên · 2026</div>
    </section>
    <aside class="right">
      <div class="dot one"></div>
      <div class="badge"><strong>90</strong><span>NGÀY</span></div>
      <div class="line"></div>
      <div class="dot two"></div>
    </aside>
  </div>
</body>
</html>
